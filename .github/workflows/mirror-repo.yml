name: Mirror Multiple Repos
on:
  workflow_dispatch:

jobs:
  mirror-list:
    runs-on: ubuntu-latest   

    env:
      # Credentials for the SOURCE repo(s)
      SOURCE_PAT_USER: ${{ secrets.SOURCE_PAT_USER }}
      SOURCE_PAT_TOKEN: ${{ secrets.SOURCE_PAT_TOKEN }}

      # Credentials for the DESTINATION repo(s)
      DEST_PAT_USER: ${{ secrets.DEST_PAT_USER }}
      DEST_PAT_TOKEN: ${{ secrets.DEST_PAT_TOKEN }}

    steps:
      - name: Mirror all listed repo pairs
        run: |
          set -euo pipefail

          # ---- EDIT THIS LIST: add/remove "source_url dest_url" pairs
          cat << 'EOF' > repo_pairs.txt
          https://github.com/Meena-1601/python-app-deploy https://github.com/meenasubashri1998-code/python-app-deploy
          https://github.com/Meena-1601/aws_resource_list.sh https://github.com/meenasubashri1998-code/aws_resource_list.sh
          https://github.com/Meena-1601/Jenkins-pipeline https://github.com/meenasubashri1998-code/Jenkins-pipeline
          https://github.com/Meena-1601/git-pjt https://github.com/meenasubashri1998-code/git-pjt
          EOF
          # --------------------------------------------------------------------------------

          while read -r SOURCE DEST; do
            [ -z "$SOURCE" ] && continue   # skip blank lines
            echo ">>> Mirroring $SOURCE -> $DEST"

            AUTH_SOURCE=$(echo "$SOURCE" | sed "s#https://#https://$SOURCE_PAT_USER:$SOURCE_PAT_TOKEN@#")
            AUTH_DEST=$(echo "$DEST" | sed "s#https://#https://$DEST_PAT_USER:$DEST_PAT_TOKEN@#")

            git clone --bare "$AUTH_SOURCE" repo-mirror.git
            cd repo-mirror.git
            git remote set-url origin "$AUTH_DEST"
            git push origin 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*' --force
            cd ..
            rm -rf repo-mirror.git

            echo ">>> Done: $SOURCE -> $DEST"
          done < repo_pairs.txt
